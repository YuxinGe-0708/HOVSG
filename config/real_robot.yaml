main:
  device: cuda
  dataset: real_robot
  scene_id: scene_001
  split: test

  package_path: /mnt/data/real_camera/isaac/HOV-SG-graph-dev/hovsg

  # Base directory for robot recordings.
  # The program appends: split/scene_id
  # Actual input directory:
  # /mnt/data/real_camera/robot_recordings/test/scene_001
  # Each scene's camera.json must define exactly one depth conversion:
  # depth_meters_per_unit: 0.001  # raw millimeters multiplied by 0.001 -> meters
  # or
  # depth_units_per_meter: 1000.0 # raw millimeters divided by 1000 -> meters
  # The ambiguous legacy field depth_scale is rejected.

  dataset_path: /mnt/data/real_camera/robot_recordings

  save_path: /mnt/data/real_camera/outputs/HOV-SG-graph-dev
  # Optional exact directory containing full_pcd.ply, mask_feats.pt, and
  # objects/. Used by application/build_graph_from_feature_map.py.
  feature_map_path: null

models:
  clip:
    type: ViT-H-14
    checkpoint: /mnt/data/real_camera/isaac/HOV-SG-graph-dev/checkpoints/laion2b_s32b_b79k.bin

  sam:
    type: vit_h
    checkpoint: /mnt/data/real_camera/isaac/HOV-SG-graph-dev/checkpoints/sam_vit_h_4b8939.pth
    points_per_side: 16
    pred_iou_thresh: 0.86
    points_per_batch: 144
    crop_n_layers: 0
    stability_score_thresh: 0.92
    min_mask_region_area: 50

pipeline:
  extract_semantics: false
  create_graph: false
  create_navigation: false
  # Resume graph/navigation from saved feature-map outputs without loading SAM.
  skip_sam_initialization: false

  voxel_size: 0.03
  # Legacy fallback used by older configs and the geometry-only entry.
  skip_frames: 1
  # Build geometry from dense frames, then run SAM/CLIP on every Nth accepted
  # geometry keyframe. This keeps the map dense without paying semantic-model
  # cost for every keyframe.
  geometry_skip_frames: 1
  # Run SAM/CLIP on every second accepted geometry keyframe. Geometry remains
  # dense while semantic coverage is high enough for handheld objects.
  semantic_skip_frames: 2
  # Keep a frame when either motion threshold is reached.
  keyframe_translation_m: 0.05
  keyframe_rotation_deg: 5.0
  # Reject discontinuous localization poses instead of corrupting the map.
  max_pose_translation_jump_m: 0.75
  max_pose_rotation_jump_deg: 45.0
  # Handheld RGB-D geometry must preserve real camera pitch, roll, and height.
  # Navigation separately ignores pose height for this single-floor capture.
  pose_mode: raw # raw, planar
  planar_pose_height_m: null # null uses the first valid camera pose height
  pose_warn_tilt_deg: 5.0
  pose_warn_height_drift_m: 0.15
  # Downsample the accumulated point cloud every N accepted keyframes.
  pointcloud_fusion_batch_size: 10
  log_every_n_frames: 1 # print progress every n frames
  # Save validated geometry before SAM/CLIP starts. A failed semantic run can
  # restart from this cache without fusing all RGB-D frames again. The cache
  # is ignored automatically when any geometry input or parameter changes.
  geometry_cache_enabled: true
  resume_geometry_cache: true
  # A 3.7M x 1024 float32 point-feature matrix is about 14.2 GiB. Accumulate
  # in float16 and use bounded float32 chunks for association and final
  # normalization. Full point features are discarded after object features
  # are fused because graph/navigation resume only needs mask_feats.pt.
  feature_accumulator_dtype: float16
  feature_association_chunk_points: 32768
  feature_normalization_chunk_points: 32768
  semantic_cleanup_interval: 1
  retain_full_point_features: false
  # Final object masks below this size are not reliable navigation targets.
  min_pcd_points: 100

  # Aurora 930 driver is configured to keep 150-4000 mm.
  min_depth_m: 0.15
  max_depth_m: 4.0
  association_distance_m: 0.07

  outlier_nb_neighbors: 20
  outlier_std_ratio: 2.0

  init_overlap_thresh: 0.65
  overlap_thresh_factor: 0.025
  iou_thresh: 0.03
  clip_masked_weight: 0.4418
  clip_bbox_margin: 50
  feature_dbscan_eps: 0.01
  max_mask_distance: 5.0
  depth_weighting: false
  grid_resolution: 0.05
  # Hierarchical merging scales to hundreds of semantic keyframes. Sequential
  # merging repeatedly compares the growing global mask set and becomes
  # prohibitively slow for this 642-keyframe handheld recording.
  merge_type: hierarchical
  save_intermediate_results: true
  obj_labels: HM3DSEM_LABELS
  merge_objects_graph: false

  # Object-level denoising keeps all supported components (chair legs and
  # backrests can be disconnected) and filters the resulting mask afterward.
  object_dbscan_eps_m: 0.07
  object_dbscan_min_points: 5
  object_dbscan_min_cluster_points: 8
  object_dbscan_min_cluster_ratio: 0.02

  # Robust single-floor fallback. A detected height peak is preferred as the
  # floor level; these quantiles only reject extreme vertical outliers and
  # provide a fallback when the height histogram has no usable peaks.
  force_single_floor: true
  min_floor_height: 0.5
  single_floor_lower_quantile: 0.02
  single_floor_upper_quantile: 0.98
  single_floor_lower_margin_m: 0.15
  # Single-floor ground estimation first finds peaks in the height histogram,
  # then validates horizontal RANSAC planes using camera position, X-Z area
  # and connected coverage. Quantiles are used only as a last fallback.
  ground_estimation_voxel_m: 0.05
  ground_normal_radius_m: 0.15
  ground_normal_max_nn: 50
  ground_normal_max_tilt_deg: 20.0
  ground_histogram_bin_m: 0.02
  ground_histogram_smoothing_sigma: 2.0
  ground_peak_min_distance_m: 0.15
  ground_peak_band_m: 0.10
  ground_plane_distance_threshold_m: 0.04
  ground_min_plane_inliers: 100
  ground_coverage_cell_m: 0.10
  ground_camera_height_min_m: 0.35
  ground_camera_height_max_m: 2.20
  ground_pose_proximity_m: 1.00
  ground_min_camera_height_support_ratio: 0.50
  ground_min_pose_proximity_ratio: 0.15
  # A drifting trajectory can reproduce one physical floor at several Y
  # levels. Keep only large, connected, horizontal, trajectory-supported peaks
  # near the best ground anchor; small table-like peaks remain obstacles.
  ground_family_enabled: true
  ground_family_max_height_delta_m: 0.90
  ground_family_min_coverage_ratio: 0.35
  ground_family_min_connected_fraction: 0.65
  ground_family_min_camera_height_support_ratio: 0.65
  ground_family_min_pose_proximity_ratio: 0.15
  ground_family_min_verticality: 0.98
  # Fail closed instead of silently treating a low outlier quantile as ground.
  ground_allow_quantile_fallback: false
  single_floor_min_room_height_m: 2.0
  single_floor_max_room_height_m: 4.0
  ceiling_min_camera_clearance_m: 0.30

robot:
  # Used only for assigning poses in multi-floor mode. Single-floor handheld
  # navigation intentionally ignores pose height.
  camera_height_m: 1.05
  radius_m: 0.28
  safety_margin_m: 0.10

navigation:
  cell_size_m: 0.05
  # Reconstruct locally supported ground surfaces in X-Z-height space. This
  # bridges continuous SLAM floor drift between global height peaks while
  # keeping small horizontal objects and vertical structures as obstacles.
  local_ground_enabled: true
  local_ground_cell_m: 0.10
  local_ground_height_bin_m: 0.04
  local_ground_normal_radius_m: 0.15
  local_ground_normal_max_nn: 50
  local_ground_normal_max_tilt_deg: 20.0
  local_ground_min_points_per_voxel: 2
  local_ground_min_component_area_m2: 5.0
  local_ground_envelope_margin_m: 0.20
  local_ground_support_radius_cells: 1
  # Mark a 0.5 m neighborhood around every valid horizontal camera position.
  pose_region_radius_m: 0.50
  # Only a narrow band around the fitted ground is used as floor evidence.
  # Obstacles must have multiple supporting points in a cell and are inflated
  # by the robot radius plus its safety margin.
  ground_band_below_m: 0.08
  ground_band_above_m: 0.12
  ground_family_exclusion_below_m: 0.10
  ground_family_exclusion_above_m: 0.15
  obstacle_min_height_m: 0.15
  obstacle_max_height_m: 1.80
  ceiling_clearance_m: 0.20
  obstacle_min_points_per_cell: 3
  # Remove isolated 3-D points and tiny flat components before footprint
  # inflation. Thin vertical structures are retained even when their 2-D
  # footprint is small.
  obstacle_radius_filter_enabled: true
  obstacle_radius_filter_m: 0.10
  obstacle_radius_min_neighbors: 5
  obstacle_min_component_cells: 4
  obstacle_high_confidence_min_points: 8
  obstacle_high_confidence_min_vertical_span_m: 0.12
  obstacle_high_confidence_min_component_cells: 20
  # Handheld camera poses are weak free-space evidence. Clear only weak
  # obstacle cells in a narrow centerline corridor, before inflation, and fail
  # if the requested clearing would remove more than 5% of obstacle evidence.
  trajectory_noise_clearing_enabled: true
  trajectory_noise_clearing_radius_m: 0.10
  trajectory_max_carved_obstacle_ratio: 0.05
  # This recording was made along a route that the robot can physically use.
  # Keep every 0.5 m pose neighborhood free after obstacle inflation, even
  # when the reconstructed cloud contains a conflicting drift/noise artifact.
  # Set false for recordings without this guarantee.
  pose_region_is_free: true
  # Reject a navigation map when even the narrow center of the recorded path
  # is occupied. Clearing these cells would hide unresolved SLAM ghosting and
  # could remove real obstacles, so real-robot navigation fails closed.
  pose_center_radius_m: 0.15
  max_raw_obstacle_pose_center_overlap_ratio: 0.15
  minimum_navigable_area_m2: 0.50
  # When floor detection returns one floor, navigation automatically ignores
  # camera height and disables stair inference for handheld recordings.
