# 真机完整轨迹建图配置
# 数据：scene_manual_20260731_113213
# 帧数：3982帧（完整轨迹数据）
# 相机：Aurora 930 (320x200)

main:
  device: cuda
  dataset: real_robot
  scene_id: scene_manual_20260731_113213  # 您的数据文件夹名
  split: ""  # 留空，数据直接在桌面

  # 本地Windows路径
  package_path: C:/Users/Lenovo/Documents/Codex/2026-07-24/a-m/HOV-SG-graph-dev/hovsg

  # 数据集路径：您的数据在桌面
  dataset_path: C:/Users/Lenovo/Desktop

  # 输出路径：保存到桌面outputs文件夹
  save_path: C:/Users/Lenovo/Desktop/outputs_manual

models:
  clip:
    type: ViT-H-14
    checkpoint: C:/Users/Lenovo/Documents/Codex/2026-07-24/a-m/HOV-SG-graph-dev/checkpoints/laion2b_s32b_b79k.bin

  sam:
    type: vit_h
    checkpoint: C:/Users/Lenovo/Documents/Codex/2026-07-24/a-m/HOV-SG-graph-dev/checkpoints/sam_vit_h_4b8939.pth
    points_per_side: 10
    pred_iou_thresh: 0.90
    points_per_batch: 144
    crop_n_layers: 0
    stability_score_thresh: 0.95
    min_mask_region_area: 150

pipeline:
  # ✅ 开启所有建图功能
  extract_semantics: true
  create_graph: true
  create_navigation: true

  # ✅ 针对3982帧优化的参数
  voxel_size: 0.04
  skip_frames: 5  # 3982帧太多，跳5帧 -> 约797帧候选

  # 关键帧选择
  keyframe_translation_m: 0.05
  keyframe_rotation_deg: 5.0

  # 位姿跳变检测
  max_pose_translation_jump_m: 0.5
  max_pose_rotation_jump_deg: 30.0

  # 点云融合
  pointcloud_fusion_batch_size: 5
  log_every_n_frames: 10
  min_pcd_points: 50

  # 深度过滤（针对Aurora 930）
  min_depth_m: 0.20
  max_depth_m: 3.5
  association_distance_m: 0.08

  # 去噪
  outlier_nb_neighbors: 30
  outlier_std_ratio: 2.5

  # Mask合并
  init_overlap_thresh: 0.75
  overlap_thresh_factor: 0.025
  iou_thresh: 0.05

  # CLIP特征
  clip_masked_weight: 0.4418
  clip_bbox_margin: 50
  feature_dbscan_eps: 0.01
  max_mask_distance: 5.0
  depth_weighting: false

  # 房间分割
  grid_resolution: 0.08
  merge_type: sequential
  save_intermediate_results: true
  obj_labels: HM3DSEM_LABELS
  merge_objects_graph: false

  # ✅ 单楼层和房间分割配置
  force_single_floor: true
  min_floor_height: 0.5
  skip_room_segmentation_if_small: true
  min_room_coverage: 2.0

robot:
  camera_height_m: 1.05
  radius_m: 0.28
  safety_margin_m: 0.15

navigation:
  cell_size_m: 0.05
  min_clearance_m: 0.40

# ✅ 处理时间估算（3982帧，skip=5）
# 候选帧数：3982 / 5 = 797帧
# 估算时间：797 × 4秒 = 3188秒 ≈ 53分钟
# 实际可能需要：45-70分钟（取决于GPU性能）
